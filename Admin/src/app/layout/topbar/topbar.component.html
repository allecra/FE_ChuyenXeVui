<header class="topbar">
  <div class="topbar__left">
    <span class="topbar__breadcrumb">Hệ thống</span>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
    <span class="topbar__breadcrumb topbar__breadcrumb--active">{{ breadcrumb }}</span>
  </div>
  <div class="topbar__right">
    <div class="topbar__user">
      <div class="topbar__user-info">
        <span class="topbar__user-name">{{ user.name }}</span>
        <span class="topbar__user-role">{{ user.role }}</span>
      </div>
      <div class="topbar__avatar">{{ user.name[0] }}</div>
      <button class="topbar__logout" (click)="logout()" title="Đăng xuất">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>
  </div>
</header>
