<div class="hero-section">
  <!-- Background Image -->
  <div class="background-image"></div>
  
  <!-- Main Content -->
  <div class="hero-content">
    <!-- Search Form Overlay -->
    <div class="search-overlay">
      <div class="search-form">
        <div class="search-form-inner">
          <div class="search-form-fields">
            <div class="search-field">
              <div class="field-label">Điểm Khởi Hành</div>
              <input 
                type="text" 
                class="field-input" 
                placeholder="Chọn Điểm Khởi Hành"
                [(ngModel)]="searchForm.departure"
                (click)="onDepartureClick()"
              />
            </div>
            <div class="search-field">
              <div class="field-label">Điểm Đến</div>
              <input 
                type="text" 
                class="field-input" 
                placeholder="Chọn Điểm Đến"
                [(ngModel)]="searchForm.destination"
                (click)="onDestinationClick()"
              />
            </div>
            <div class="search-field">
              <div class="field-label">Ngày Khởi Hành</div>
              <div class="date-input-wrapper">
                <img class="calendar-icon" src="assets/img/common/calendar.svg" alt="Calendar" />
                <input 
                  type="date" 
                  class="field-input date-input" 
                  [(ngModel)]="searchForm.departureDate"
                />
              </div>
            </div>
            <div class="search-button-wrapper">
              <button class="search-button" (click)="onSearch()">
                <img class="search-icon" src="assets/img/common/search.svg" alt="Search" />
                <span class="button-text">TÌM CHUYẾN XE</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Expanded Search Overlay -->
  <div class="expanded-search-overlay" [class.active]="isSearchExpanded" (click)="closeExpandedSearch()">
    <div class="expanded-search-container" (click)="$event.stopPropagation()">
      <div class="expanded-search-header">
        <h2 class="expanded-search-title">Tìm kiếm chuyến xe</h2>
        <button class="close-search-btn" (click)="closeExpandedSearch()">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      
      <div class="expanded-search-content">
        <div class="expanded-search-input-wrapper">
          <input 
            type="text" 
            class="expanded-search-input" 
            placeholder="Nhập từ khóa tìm kiếm (tên tuyến đường, nhà xe, bến xe...)"
            [(ngModel)]="expandedSearchQuery"
            (keydown)="onExpandedSearchKeydown($event)"
          />
          <button class="expanded-search-submit" (click)="onExpandedSearch()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M21 21L16.514 16.506L21 21ZM19 10.5C19 15.194 15.194 19 10.5 19C5.806 19 2 15.194 2 10.5C2 5.806 5.806 2 10.5 2C15.194 2 19 5.806 19 10.5Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
        
        <div class="search-suggestions">
          <div class="suggestions-title">Gợi ý tìm kiếm:</div>
          <div class="suggestions-list">
            <button class="suggestion-item" (click)="expandedSearchQuery = 'Sài Gòn Đà Lạt'; onExpandedSearch()">
              Sài Gòn - Đà Lạt
            </button>
            <button class="suggestion-item" (click)="expandedSearchQuery = 'Hà Nội Hải Phòng'; onExpandedSearch()">
              Hà Nội - Hải Phòng
            </button>
            <button class="suggestion-item" (click)="expandedSearchQuery = 'Nhà xe Phương Trang'; onExpandedSearch()">
              Nhà xe Phương Trang
            </button>
            <button class="suggestion-item" (click)="expandedSearchQuery = 'Bến xe Miền Đông'; onExpandedSearch()">
              Bến xe Miền Đông
            </button>
            <button class="suggestion-item" (click)="expandedSearchQuery = 'Đà Nẵng Hội An'; onExpandedSearch()">
              Đà Nẵng - Hội An
            </button>
            <button class="suggestion-item" (click)="expandedSearchQuery = 'Nha Trang Đà Lạt'; onExpandedSearch()">
              Nha Trang - Đà Lạt
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Sidebar Search Button - Moved outside hero-section to avoid overflow issues -->
<div class="sidebar-search">
  <button class="sidebar-search-btn" (click)="openExpandedSearch()" title="Tìm kiếm nhanh">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M21 21L16.514 16.506L21 21ZM19 10.5C19 15.194 15.194 19 10.5 19C5.806 19 2 15.194 2 10.5C2 5.806 5.806 2 10.5 2C15.194 2 19 5.806 19 10.5Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</div>
