<div class="slider-section">
  @if (title) {
    <div class="slider-section-title"
         [class.tight-top]="tightTitleTop"
         [style.border-left-color]="titleBorderColor"
         [style.background-color]="titleBgColor">
      {{ title }}
    </div>
  }
  <div class="slider-section-row" [class.slider-section-row-content-only]="arrowsPosition === 'bottom'">
    @if (arrowsPosition !== 'bottom') {
      <button type="button"
              class="slider-arrow slider-arrow-left"
              (click)="prevClick.emit()"
              [class.disabled]="!canGoPrev"
              aria-label="Trước">‹</button>
    }
    <div class="slider-section-content" [class.grid-layout]="useGridLayout">
      <ng-content></ng-content>
    </div>
    @if (arrowsPosition !== 'bottom') {
      <button type="button"
              class="slider-arrow slider-arrow-right"
              (click)="nextClick.emit()"
              [class.disabled]="!canGoNext"
              aria-label="Sau">›</button>
    }
  </div>
  @if (arrowsPosition === 'bottom') {
    <div class="slider-arrows-bottom">
      <button type="button"
              class="slider-arrow slider-arrow-bottom"
              (click)="prevClick.emit()"
              [class.disabled]="!canGoPrev"
              aria-label="Trước">‹</button>
      <button type="button"
              class="slider-arrow slider-arrow-bottom"
              (click)="nextClick.emit()"
              [class.disabled]="!canGoNext"
              aria-label="Sau">›</button>
    </div>
  }
</div>
