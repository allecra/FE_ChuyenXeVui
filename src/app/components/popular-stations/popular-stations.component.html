<app-slider-section
  title="Bến xe phổ biến"
  titleBorderColor="#40a944"
  titleBgColor="#f9ffe7"
  [useGridLayout]="true"
  arrowsPosition="bottom"
  [canGoPrev]="canGoPrev"
  [canGoNext]="canGoNext"
  (prevClick)="onPrevClick()"
  (nextClick)="onNextClick()">
  <div class="stations-container">
    <app-orange-card
      *ngFor="let station of currentStations"
      layout="image-first"
      [cardWidth]="260"
      [cardHeight]="219"
      [imageHeight]="170"
      [imageUrl]="'assets/img/bus-stations/' + station.image"
      [title]="station.name"
      [imageAlt]="station.name">
    </app-orange-card>
  </div>
</app-slider-section>

<!-- Nút Xem tất cả -->
<div class="view-all-container">
  <button class="view-all-button" (click)="navigateToStations()">
    Xem tất cả
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
      <path d="M5 12H19M19 12L12 5M19 12L12 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</div>
