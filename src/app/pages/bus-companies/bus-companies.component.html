<div class="bus-companies-page">
  <!-- Page Title -->
  <div class="page-title-section">
    <div class="container">
      <h1 class="page-title">NHÀ XE</h1>
    </div>
  </div>

  <div class="companies-content">
    <div class="container">
      <!-- Loading State -->
      <div *ngIf="isLoading" class="loading-state">
        <div class="loading-spinner"></div>
        <p>Đang tải danh sách nhà xe...</p>
      </div>

      <!-- Companies Grid -->
      <div class="companies-grid" *ngIf="!isLoading">
        <app-orange-card
          *ngFor="let company of companies"
          layout="image-first"
          [cardWidth]="260"
          [cardHeight]="219"
          [imageHeight]="170"
          [imageUrl]="'assets/img/bus-companies/' + company.image"
          [title]="company.name"
          [imageAlt]="company.name">
        </app-orange-card>
      </div>

      <!-- Pagination -->
      <app-pagination
        *ngIf="totalPages > 1 && !isLoading"
        [currentPage]="currentPage"
        [totalPages]="totalPages"
        [isLoading]="isLoading"
        (pageChange)="onPageChange($event)">
      </app-pagination>
    </div>
  </div>
</div>
