<div class="routes-page">
  <!-- Page Title -->
  <div class="page-title-section">
    <div class="container">
      <h1 class="page-title">TUYẾN ĐƯỜNG</h1>
    </div>
  </div>

  <div class="routes-content">
    <div class="container">
      <!-- Loading State -->
      <div *ngIf="isLoading" class="loading-state">
        <div class="loading-spinner"></div>
        <p>Đang tải danh sách tuyến đường...</p>
      </div>

      <!-- Routes Grid -->
      <div class="routes-grid" *ngIf="!isLoading">
        <div class="route-card" *ngFor="let route of routes">
          <!-- Tên tuyến đường và giá -->
          <div class="route-header">
            <h3 class="route-title">{{ route.fromLocation }} – {{ route.toLocation }}</h3>
            <p class="route-price">{{ route.price | number:'1.0-0' }}đ</p>
          </div>
          
          <!-- 1 ảnh duy nhất -->
          <div class="route-image-container">
            <img [src]="'assets/img/home/' + route.image" [alt]="route.fromLocation + ' - ' + route.toLocation" class="route-img" />
          </div>
        </div>
      </div>

      <!-- Pagination -->
      <app-pagination
        *ngIf="totalPages > 1 && !isLoading"
        [currentPage]="currentPage"
        [totalPages]="totalPages"
        [isLoading]="isLoading"
        (pageChange)="onPageChange($event)">
      </app-pagination>
    </div>
  </div>
</div>
