<div class="routes-page">
  <!-- Page Title -->
  <div class="page-title-section">
    <div class="container">
      <h1 class="page-title">TUYẾN ĐƯỜNG</h1>
    </div>
  </div>

  <div class="routes-content">
    <div class="container">
      <!-- Loading State -->
      <div *ngIf="isLoading" class="loading-state">
        <div class="loading-spinner"></div>
        <p>Đang tải danh sách tuyến đường...</p>
      </div>

      <!-- Routes Grid -->
      <div class="routes-grid" *ngIf="!isLoading">
        <app-orange-card
          *ngFor="let route of routes"
          layout="image-first"
          [cardWidth]="260"
          [cardHeight]="286"
          [imageHeight]="170"
          [imageUrl]="'assets/img/home/' + route.image"
          [title]="route.title"
          [subtitle]="route.description"
          [subtitleColor]="'#666'"
          [imageAlt]="route.title">
        </app-orange-card>
      </div>

      <!-- Pagination -->
      <app-pagination
        *ngIf="totalPages > 1 && !isLoading"
        [currentPage]="currentPage"
        [totalPages]="totalPages"
        [isLoading]="isLoading"
        (pageChange)="onPageChange($event)">
      </app-pagination>
    </div>
  </div>
</div>
