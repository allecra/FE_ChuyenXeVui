<div class="bus-stations-page">
  <!-- Page Title -->
  <div class="page-title-section">
    <div class="container">
      <h1 class="page-title">BẾN XE</h1>
    </div>
  </div>

  <div class="stations-content">
    <div class="container">
      <!-- Loading State -->
      <div *ngIf="isLoading" class="loading-state">
        <div class="loading-spinner"></div>
        <p>Đang tải danh sách bến xe...</p>
      </div>

      <!-- Stations Grid -->
      <div class="stations-grid" *ngIf="!isLoading">
        <app-orange-card
          *ngFor="let station of stations"
          layout="image-first"
          [cardWidth]="260"
          [cardHeight]="262"
          [imageHeight]="170"
          [imageUrl]="'assets/img/bus-stations/' + station.image"
          [title]="station.name"
          [subtitle]="station.location"
          [subtitleColor]="'#666'"
          [imageAlt]="station.name">
        </app-orange-card>
      </div>

      <!-- Pagination -->
      <app-pagination
        *ngIf="totalPages > 1 && !isLoading"
        [currentPage]="currentPage"
        [totalPages]="totalPages"
        [isLoading]="isLoading"
        (pageChange)="onPageChange($event)">
      </app-pagination>
    </div>
  </div>
</div>
